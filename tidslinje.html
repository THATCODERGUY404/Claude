<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tidslinje mellankrigstiden–WWII</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE calm, encouraging study app for a history test
   IDEA a revision kit: read the chronology, see the chains of cause and effect, drill with flashcards
   PICTURE the vertical era-coloured timeline, cause chains as linked steps, term cards and one big quiz card
   COLOUR white ground, ink, era colours blue, ochre, red, teal; green and red only for right and wrong
   TYPE Archivo Narrow for years and headings + Inter for text
   LAYOUT one 760px column; tabs in the header on desktop, a bottom tab bar on phones */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#111317);--ink:light-dark(#16181d,#eceef2);--mute:light-dark(#5d626d,#a3a8b3);--line:light-dark(#e3e5ea,#2b2e36);--panel:light-dark(#f4f5f7,#1b1e24);--ok:light-dark(#137a3e,#5ad48c);--bad:light-dark(#c62828,#ff7a72);--p0:light-dark(#2b59c3,#7ea2ff);--p1:light-dark(#a86f00,#f0b93a);--p2:light-dark(#c62828,#ff7a72);--p3:light-dark(#137a6d,#4fd1bd)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.yr,.q,.big{font-family:"Archivo Narrow",Inter,sans-serif;letter-spacing:-.01em}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
.hd{max-width:760px;margin:0 auto;padding:14px 16px 0}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:clamp(22px,3.4vw,28px);line-height:1.1;margin:0}
.stat{font-size:14px;color:var(--mute);white-space:nowrap;text-align:right}
.stat b{color:var(--ink)}
.prog{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--panel);gap:2px;margin:10px 0 0}
.prog div{background:color-mix(in srgb,var(--pc) 20%,var(--panel));position:relative}
.prog div i{position:absolute;inset:0 auto 0 0;background:var(--pc)}
nav{display:flex;gap:4px;margin-top:6px}
nav button{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;border-bottom:3px solid transparent;display:flex;gap:6px;align-items:center}
nav button[aria-selected=true]{border-color:var(--ink)}
nav button:focus-visible{outline:2px solid var(--p0)}
nav .badge{font-size:12px;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
@media(max-width:600px){nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);margin:0;padding:0 0 env(safe-area-inset-bottom,0px);z-index:20}nav button{flex:1;justify-content:center;border-bottom:0;border-top:3px solid transparent;padding:12px 0 14px}nav button[aria-selected=true]{border-color:var(--ink)}.hd{padding-bottom:10px}}
.intro{color:var(--mute);font-size:15px;margin:18px 0 12px}
.intro a{color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--pc)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--p0);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
select,input[type=search]{font:inherit;font-size:16px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 10px}
input[type=search]{flex:1 1 160px}
select:focus-visible,input:focus-visible,.btn:focus-visible{outline:2px solid var(--p0);outline-offset:1px}
.count{font-size:14px;color:var(--mute);margin:4px 0 8px}
.btn{font:inherit;font-size:15px;font-weight:600;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{cursor:default}
/* read */
.era{margin:22px 0 6px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--pc) 10%,var(--bg))}
.era h2{margin:0;font-size:22px;line-height:1.15;color:color-mix(in srgb,var(--pc) 75%,var(--ink))}
.era p{margin:4px 0 0;font-size:15px}
.yr{font-size:22px;font-weight:700;margin:14px 0 2px;padding-left:30px;position:relative;display:flex;gap:10px;align-items:baseline}
.yr small{font-family:Inter,sans-serif;font-size:13px;font-weight:600;color:var(--mute);letter-spacing:0}
.yr::before{content:"";position:absolute;left:5px;top:50%;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--pc);transform:translateY(-50%)}
.yr.anc::before{background:var(--pc)}
.ev{position:relative;padding-left:30px}
.ev::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:3px;background:color-mix(in srgb,var(--pc) 45%,transparent)}
.ev>button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;gap:2px 12px;padding:9px 8px;border-radius:8px;align-items:baseline}
.ev>button:hover,.ev.open>button{background:var(--panel)}
.ev>button:focus-visible{outline:2px solid var(--p0)}
.ev .d{font-size:14px;color:var(--mute);font-weight:600}
.ev .t{line-height:1.35}
.ev .t small{display:block;color:var(--mute);font-size:13px}
.ev .m{font-size:14px;white-space:nowrap}
.k{color:var(--p1)}.okc{color:var(--ok);font-weight:700}
.ev.key .t{font-weight:600}
.hide .ev .d .v{filter:blur(6px);user-select:none}
.ev .x{padding:2px 8px 14px calc(7.5em + 20px)}
.ev .x p{margin:6px 0 10px;max-width:62ch}
.ev .x .lk{font-size:14px;color:var(--mute);margin:0 0 10px}
.ev .x .lk button{all:unset;cursor:pointer;color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.empty{padding:30px 0;color:var(--mute)}
/* chains */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:6px}
.ccard{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(90deg,var(--c1),var(--c2)) top/100% 5px no-repeat,var(--bg)}
.ccard:hover{border-color:var(--ink)}
.ccard:focus-visible{outline:2px solid var(--p0)}
.ccard h3{margin:0;font-size:21px;line-height:1.15}
.ccard span{font-size:14px;color:var(--mute)}
.chain h2{font-size:clamp(26px,4vw,34px);line-height:1.1;margin:16px 0 4px}
.chain .lead{color:var(--mute);margin:0 0 14px}
.step{border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:10px;padding:10px 14px}
.step .d{font-size:14px;font-weight:700;color:color-mix(in srgb,var(--pc) 75%,var(--ink))}
.why{display:flex;gap:10px;align-items:flex-start;padding:6px 0 6px 18px;font-size:15px;color:var(--mute)}
.why::before{content:"↓";font-weight:700;color:var(--ink);font-size:18px;line-height:1.2}
.hidewhy .why span{filter:blur(5px)}
.cbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
/* practice */
.start h2{font-size:30px;line-height:1.1;margin:18px 0 6px}
.start p{margin:0 0 14px;color:var(--mute)}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.opt:hover{border-color:var(--ink)}
.opt:focus-visible{outline:2px solid var(--p0)}
.opt b{display:block;font-size:17px}
.opt small{color:var(--mute);font-size:14px}
.opt .go{font-size:20px}
.opt.rec{border-color:var(--ink);border-width:2px}
.sec{font-size:14px;font-weight:600;color:var(--mute);margin:18px 0 8px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0 10px}
.dots{display:flex;gap:4px;flex:1}
.dots i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.dots i.r{background:var(--ok)}.dots i.w{background:var(--bad)}.dots i.c{background:var(--ink)}
.qcard{border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,28px);border-top:6px solid var(--pc)}
.qmeta{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--mute);flex-wrap:wrap}
.q{font-size:clamp(24px,4vw,32px);line-height:1.15;margin:10px 0 18px;font-weight:700;text-wrap:balance}
.ask{font-size:15px;font-weight:600;margin:-8px 0 14px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.txt{grid-template-columns:1fr}
.opts .btn{min-height:56px;font-size:20px;font-family:"Archivo Narrow",sans-serif}
.opts.txt .btn{font:500 16px/1.35 Inter,sans-serif;text-align:left;padding:12px 16px}
.btn.right{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important;opacity:1!important}
.btn.wrong{background:var(--bad)!important;border-color:var(--bad)!important;color:#fff!important;opacity:1!important}
.opts .btn:disabled{opacity:.5}
.ord{display:grid;gap:8px}
.ord .btn{display:flex;gap:12px;align-items:center;text-align:left;font-weight:500;padding:10px 14px;min-height:56px;line-height:1.3}
.ord .btn:disabled{opacity:1}
.ord .n{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700}
.ord .btn.sel .n{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ord .btn.ri{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.ord .btn.wr{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.ord .y{margin-inline-start:auto;font-weight:700;white-space:nowrap}
.big{font-size:clamp(36px,7vw,52px);font-weight:700;line-height:1;margin:4px 0 8px}
.fb{margin-top:16px;padding:14px;border-radius:10px;background:var(--panel)}
.fb b.ok{color:var(--ok)}.fb b.bad{color:var(--bad)}
.fb p{margin:6px 0 0}
.tip{font-size:14px;color:var(--mute);margin-top:8px}
.tip b{color:var(--ink)}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.rate .btn{min-height:52px;font-size:15px;line-height:1.2}
.rate .b0{border-color:var(--bad);color:var(--bad)}.rate .b2{border-color:var(--ok);color:var(--ok)}
.qbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
.kbd{font-size:13px;color:var(--mute);margin-top:10px}
.sum{text-align:center;padding:24px 0}
.sum .big{font-size:64px}
.miss{text-align:left;margin:16px 0}
.miss div{padding:8px 0;border-top:1px solid var(--line)}
.miss small{color:var(--mute);display:block}
.note{font-size:13px;color:var(--mute);margin-top:28px;border-top:1px solid var(--line);padding-top:10px}
@media(max-width:600px){.ev>button{grid-template-columns:minmax(0,1fr) auto}.ev .d{grid-column:1/-1;font-size:13px;margin-bottom:-2px}.ev .x{padding-left:8px}.opts .btn{font-size:18px}.kbd{display:none}.stat .lg{display:none}}
@media(prefers-reduced-motion:no-preference){.qcard.new{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}

.tcard{all:unset;box-sizing:border-box;overflow-wrap:anywhere;cursor:pointer;display:block;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.tcard:hover{border-color:var(--ink)}
.tcard:focus-visible{outline:2px solid var(--p0)}
.tcard b{font-size:17px;display:flex;justify-content:space-between;gap:8px}
.tcard span{display:block;margin-top:4px;font-size:15px}
.hidedef .tcard:not(.rev) span{filter:blur(6px);user-select:none}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
.qitem{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.qitem h3{font-family:Inter,sans-serif;font-size:16px;font-weight:600;line-height:1.4;margin:0 0 10px;letter-spacing:0;display:flex;gap:10px}
.qitem h3 .nr{flex:none;width:26px;height:26px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:13px}
.qitem ul{margin:8px 0 10px;padding-left:20px}
.qitem li{margin-bottom:4px}
.qitem .acts{display:flex;gap:8px;flex-wrap:wrap}
.qitem .btn{min-height:38px;font-size:14px}
.qitem.done{border-color:var(--ok)}
.tag{font-size:12px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:0 7px;margin-left:6px;white-space:nowrap}
@media(max-width:600px){.tgrid{grid-template-columns:1fr}nav button{font-size:14px;padding:12px 0 14px}}
</style>
</head>
<body>
<header><div class="hd">
  <div class="hrow"><h1>Mellankrigstiden och andra världskriget</h1><div class="stat"><span title="Händelser du kan">✓ <b id="known">0</b>/<span id="tot"></span></span><span class="lg"> händelser · <b id="tk">0</b>/<span id="tt"></span> begrepp</span></div></div>
  <div class="prog" id="prog"></div>
  <nav role="tablist">
    <button role="tab" data-v="las">Läs</button>
    <button role="tab" data-v="samband">Samband</button>
    <button role="tab" data-v="begrepp">Begrepp</button>
    <button role="tab" data-v="fragor">Frågor</button>
    <button role="tab" data-v="ova">Öva <span class="badge" id="due" hidden></span></button>
  </nav>
</div></header>
<div class="wrap" id="app"></div>
<script>
{
const E=[{"id":"rysrev","d":"1917","y0":1917,"y1":1917,"c":"Ryssland","t":"Ryska revolutionen: Lenin och kommunisterna tar makten","x":"1917 kom två revolutioner i Ryssland. I februari störtades tsaren och i oktober tog bolsjevikerna (kommunisterna) under Lenin makten. Det ledde till inbördeskrig och till att Sovjetunionen bildades 1922.","ex":1},{"id":"vk1slut","d":"1918","y0":1918,"y1":1918,"c":"Europa","t":"Första världskriget slut","x":"Den 11 november 1918 skrevs vapenstilleståndet under och striderna i första världskriget upphörde. Kejsaren i Tyskland hade abdikerat två dagar tidigare. Omkring 17 miljoner människor hade dött i kriget.","ex":0},{"id":"weimar","d":"1919","y0":1919,"y1":1919,"c":"Tyskland","t":"Weimarrepubliken: Tyskland blir en demokrati","x":"Efter kejsarens fall valdes en nationalförsamling som samlades i den lugna staden Weimar, eftersom Berlin var oroligt. Där skrevs en demokratisk författning med allmän rösträtt för både kvinnor och män. Republiken kallas Weimarrepubliken.","ex":1},{"id":"versailles","d":"1919","y0":1919,"y1":1919,"c":"Europa","t":"Versaillesfreden","x":"Freden i Versailles 1919 gav Tyskland skulden för kriget. Tyskland förlorade mark och alla kolonier, fick bara ha en liten armé på 100 000 man och skulle betala stora krigsskadestånd. Många tyskar kände sig förödmjukade.","ex":0},{"id":"rostusa","d":"1920","y0":1920,"y1":1920,"c":"USA","t":"Kvinnor får rösträtt i USA","x":"Genom det 19:e tillägget till författningen 1920 fick amerikanska kvinnor rösträtt i alla val. Det var en seger för den långa rösträttsrörelsen. Kampen hade förts av suffragetterna sedan 1800-talet.","ex":0},{"id":"rost21","d":"1921","y0":1921,"y1":1921,"c":"Sverige","t":"Allmänna och lika val i Sverige","x":"1921 hölls det första riksdagsvalet där både kvinnor och män fick rösta på lika villkor. Beslutet om allmän och lika rösträtt hade tagits 1918–1919. Sverige var nu en fullständig demokrati.","ex":0},{"id":"mussolini22","d":"1922","y0":1922,"y1":1922,"c":"Italien","t":"Mussolini och fascisterna tar makten i Italien","x":"I oktober 1922 organiserade Mussolini ”marschen mot Rom” med tusentals fascistiska svartskjortor. Kungen vågade inte stoppa dem utan utsåg Mussolini till regeringschef. Det räknas som en statskupp. Några år senare förbjöds alla andra partier och Italien blev en diktatur.","ex":0},{"id":"inflation","d":"1923","y0":1923,"y1":1923,"c":"Tyskland","t":"Inflation i Tyskland (hyperinflation)","x":"1923 ockuperade Frankrike Ruhrområdet och inflationen nådde sin topp: i november kostade en dollar omkring 4 200 miljarder mark. Människors sparpengar blev värdelösa och medelklassen förlorade förtroendet för republiken.","ex":0},{"id":"kupp23","d":"1923","y0":1923,"y1":1923,"c":"Tyskland","t":"Hitlers kuppförsök i München misslyckas","x":"I november 1923 försökte Hitler och nazisterna ta makten i München (ölkällarkuppen). Kuppen slogs ner och Hitler dömdes till fängelse. Där skrev han Mein Kampf, med sina idéer om ras, judehat och ”livsrum” i öst.","ex":1},{"id":"folkhem","d":"1928","y0":1928,"y1":1928,"c":"Sverige","t":"Per Albin Hanssons tal om folkhemmet","x":"Socialdemokraternas ledare Per Albin Hansson beskrev i ett riksdagstal Sverige som ett ”folkhem”: samhället skulle vara som ett gott hem med jämlikhet, omtanke och trygghet för alla. Folkhemmet blev Socialdemokraternas stora mål från 1930-talet.","ex":0},{"id":"stalin29","d":"1929","y0":1929,"y1":1929,"c":"Sovjet","t":"Stalin tar makten i Sovjet","x":"Efter Lenins död 1924 följde en maktkamp, bland annat mot Trotskij. 1929 var Stalin Sovjetunionens ensamme ledare och styrde som diktator.","ex":0},{"id":"kolj","d":"1929","y0":1929,"y1":1929,"c":"Sovjet","t":"Tvångskollektivisering: bönderna måste gå med i kollektivjordbruk","x":"Stalin tvingade bönderna att gå samman i stora kollektivjordbruk (kolchoser). De mer välbärgade bönderna, kulakerna, utpekades som fiender och dödades eller deporterades till arbetsläger.","ex":1},{"id":"krasch","d":"24 okt 1929","y0":1929,"y1":1929,"c":"USA","t":"Börskraschen i USA (svarta torsdagen)","x":"Torsdagen den 24 oktober 1929 föll aktiekurserna kraftigt på Wall Street i New York, och kraschen fortsatte de följande dagarna. Banker och företag gick i konkurs och den stora depressionen spred sig över världen.","ex":0},{"id":"gulag","d":"1930-talet","y0":1930,"y1":1939,"c":"Sovjet","t":"Gulag: fångläger för miljontals människor","x":"Gulag var ett system av arbets- och fångläger, främst i Sibirien och norra Sovjet. Under 1930-talet skickades miljontals människor dit: politiska motståndare, kulaker och vanliga människor som anklagats för påhittade brott. Många dog av kyla, svält och hårt arbete.","ex":0},{"id":"adalen","d":"maj 1931","y0":1931,"y1":1931,"c":"Sverige","t":"Skotten i Ådalen","x":"I maj 1931 demonstrerade arbetare i Ådalen i Västernorrland mot strejkbrytare. Militär sattes in och sköt mot demonstrationståget, och fem personer dödades. Händelsen chockade Sverige och fick politiker, fack och arbetsgivare att börja söka kompromisser.","ex":0},{"id":"manchuriet","d":"1931","y0":1931,"y1":1931,"c":"Asien","t":"Japan tar Manchuriet och lämnar Nationernas förbund","x":"1931 ockuperade Japan Manchuriet i norra Kina och gjorde det till lydstaten Manchukuo. När Nationernas förbund kritiserade Japan lämnade landet förbundet. Det visade hur svagt NF var.","ex":1},{"id":"roosevelt","d":"1932","y0":1932,"y1":1932,"c":"USA","t":"Roosevelt blir president i USA","x":"Under depressionen var omkring 13 miljoner amerikaner arbetslösa. Franklin D. Roosevelt vann valet 1932 och lovade en ”New Deal”: staten satsade på offentliga arbeten, stöd till bönder och senare pensioner och socialförsäkringar.","ex":0},{"id":"kohandel","d":"1932","y0":1932,"y1":1932,"c":"Sverige","t":"”Kohandeln” i Sverige","x":"Socialdemokraterna och Bondeförbundet gjorde en uppgörelse i riksdagen: S fick stöd för sin krispolitik mot arbetslösheten, och bönderna fick skydd för jordbruket och bättre priser. Kompromissen kallas kohandeln och visade att krisen kunde lösas med demokrati i stället för diktatur. (Uppgörelsen brukar dateras till 1933; boken placerar den vid 1932.)","ex":0},{"id":"holodomor","d":"1932–1934","y0":1932,"y1":1934,"c":"Sovjet","t":"Holodomor: svältkatastrofen i Sovjet","x":"Tvångskollektiviseringen och stora krav på spannmål ledde till svält i Ukraina. Miljontals människor dog. Ukrainarna kallar svälten Holodomor, ”död genom svält”.","ex":0},{"id":"hitler33","d":"1933","y0":1933,"y1":1933,"c":"Tyskland","t":"Hitler blir Tysklands diktator","x":"I januari 1933 blev Hitler rikskansler (regeringschef). Inom ett halvår hade nazisterna förbjudit alla andra partier, krossat fackföreningarna och infört censur. Tyskland var en diktatur och politiska motståndare och judar förföljdes allt hårdare.","ex":0},{"id":"riksdagsbrand","d":"1933","y0":1933,"y1":1933,"c":"Tyskland","t":"Riksdagshusbranden och fullmaktslagen","x":"I februari 1933 brann riksdagshuset. Nazisterna skyllde på kommunisterna och förbjöd partiet. I mars antogs fullmaktslagen som gav regeringen rätt att stifta lagar utan riksdagen.","ex":1},{"id":"nurnberglagar","d":"1935","y0":1935,"y1":1935,"c":"Tyskland","t":"Nürnberglagarna","x":"Nürnberglagarna 1935 gjorde att judar inte längre var tyska medborgare. Judar och icke-judar fick inte gifta sig med varandra. Lagarna byggde på nazisternas rasläran.","ex":0},{"id":"etiopien","d":"1935","y0":1935,"y1":1935,"c":"Afrika","t":"Italiens angrepp på Etiopien","x":"Italien anföll Etiopien 1935 för att skapa ett imperium i Afrika. Italienarna använde bombflyg och giftgas mot civila. Nationernas förbund införde svaga sanktioner som inte stoppade kriget.","ex":0},{"id":"rhenlandet","d":"1936","y0":1936,"y1":1936,"c":"Tyskland","t":"Tyska trupper in i Rhenlandet","x":"Hitler bröt mot Versaillesfreden genom att återinföra värnplikten och rusta upp. 1936 skickade han trupper in i det demilitariserade Rhenlandet. Storbritannien och Frankrike reagerade inte.","ex":0},{"id":"spanska","d":"1936–1939","y0":1936,"y1":1939,"c":"Spanien","t":"Spanska inbördeskriget","x":"I juli 1936 gjorde general Franco uppror mot den vänsterregering som vunnit valet. Tyskland och Italien hjälpte Franco, Sovjet hjälpte regeringssidan och frivilliga från många länder stred i de internationella brigaderna. Franco vann 1939 och blev diktator.","ex":0},{"id":"moskva","d":"1936","y0":1936,"y1":1936,"c":"Sovjet","t":"Moskvarättegångarna inleds","x":"I Moskvarättegångarna anklagades gamla ledande kommunister för förräderi. De tvingades erkänna brott de inte begått och avrättades. Det var en del av den stora terrorn.","ex":0},{"id":"kina37","d":"1937","y0":1937,"y1":1937,"c":"Asien","t":"Japans angrepp på Kina","x":"Sommaren 1937 inledde Japan ett fullskaligt krig mot Kina. Japanerna tog storstäderna Shanghai och Nanjing efter hårda strider. När japanska soldater intog Nanjing i december 1937 mördade och våldtog de civila och fångar under flera veckor. En vanlig uppgift är omkring 300 000 döda.","ex":0},{"id":"anschluss","d":"mars 1938","y0":1938,"y1":1938,"c":"Österrike","t":"”Anslutningen” av Österrike","x":"I mars 1938 marscherade tyska trupper in i Österrike, som anslöts till Tyskland (Anschluss). Många österrikare jublade och en folkomröstning efteråt gav nästan 100 procent ja.","ex":0},{"id":"evian","d":"juli 1938","y0":1938,"y1":1938,"c":"Världen","t":"Evian-konferensen om judiska flyktingar","x":"32 länder träffades i Evian i Frankrike för att diskutera de judiska flyktingarna från Tyskland och Österrike. Nästan inget land ville ta emot fler flyktingar, så konferensen blev ett misslyckande.","ex":1},{"id":"munchen","d":"sep 1938","y0":1938,"y1":1938,"c":"Europa","t":"Münchenöverenskommelsen: Tyskland får Sudetlandet","x":"I München gick Storbritannien och Frankrike med på att Tyskland fick ta Sudetlandet från Tjeckoslovakien. Tjeckoslovakien var inte inbjudet. Chamberlain trodde att han räddat freden, så kallad eftergiftspolitik.","ex":0},{"id":"kristall","d":"9–10 nov 1938","y0":1938,"y1":1938,"c":"Tyskland","t":"Kristallnatten","x":"Natten mellan 9 och 10 november 1938 attackerade nazister judar i hela Tyskland. Synagogor brändes, butiker förstördes, minst 90 judar dödades och omkring 30 000 judiska män skickades till koncentrationsläger.","ex":0},{"id":"saltsjobad","d":"dec 1938","y0":1938,"y1":1938,"c":"Sverige","t":"Saltsjöbadsavtalet","x":"LO (fackföreningarna) och SAF (arbetsgivarna) slöt ett avtal i Saltsjöbaden om hur förhandlingar och konflikter på arbetsmarknaden skulle skötas, utan att staten blandade sig i. Avtalet ledde till färre strejker och blev grunden för ”den svenska modellen”.","ex":0},{"id":"forintelsen","d":"1938–1945","y0":1938,"y1":1945,"c":"Europa","t":"Förintelsen","x":"Förintelsen var nazisternas folkmord på Europas judar. Den växte fram steg för steg: lagar och utestängning, Kristallnatten, gettona, massavrättningar och till sist förintelselägren. Omkring sex miljoner judar mördades. Även romer, funktionsnedsatta och homosexuella förföljdes och dödades.","ex":0},{"id":"tjeck","d":"mars 1939","y0":1939,"y1":1939,"c":"Tjeckoslovakien","t":"Tyskland tar en stor bit av Tjeckoslovakien, resten blir tysk lydstat","x":"I mars 1939 ockuperade Tyskland Böhmen och Mähren, och Slovakien blev en tysk lydstat. Det var första gången Hitler tog ett område där det inte bodde tyskar, och det visade att eftergiftspolitiken hade misslyckats.","ex":0},{"id":"mrpakt","d":"aug 1939","y0":1939,"y1":1939,"c":"Europa","t":"Molotov–Ribbentrop-pakten","x":"Nazityskland och det kommunistiska Sovjet slöt en icke-angreppspakt. I ett hemligt tillägg delade de upp Östeuropa mellan sig. Pakten gjorde det möjligt för Hitler att anfalla Polen.","ex":0},{"id":"polen","d":"1 sep 1939","y0":1939,"y1":1939,"c":"Polen","t":"Tyskland anfaller Polen: andra världskriget börjar","x":"Den 1 september 1939 anföll Tyskland Polen med blixtkrig: snabba anfall med stridsvagnar och flyg. Det räknas som början på andra världskriget i Europa. Den 3 september förklarade Storbritannien och Frankrike krig mot Tyskland.","ex":0},{"id":"baltikum","d":"1939–1940","y0":1939,"y1":1940,"c":"Baltikum","t":"Sovjet ockuperar östra Polen och de baltiska staterna","x":"Enligt den hemliga delen av pakten gick Sovjet in i östra Polen i september 1939. Sedan tvingades Estland, Lettland och Litauen ta emot sovjetiska baser, och sommaren 1940 ockuperades och annekterades de.","ex":1},{"id":"vinterkriget","d":"1939–1940","y0":1939,"y1":1940,"c":"Finland","t":"Finska vinterkriget","x":"Den 30 november 1939 anföll Sovjet Finland. Finnarna gjorde hårt motstånd i kylan och Sovjet fick stora förluster. I mars 1940 slöts fred i Moskva. Finland behöll sin självständighet men fick lämna ifrån sig stora delar av Karelen. Sverige stödde Finland med frivilliga och vapen men skickade inga trupper.","ex":0},{"id":"samling","d":"dec 1939","y0":1939,"y1":1939,"c":"Sverige","t":"Samlingsregering i Sverige","x":"När kriget bröt ut bildades en samlingsregering under Per Albin Hansson med alla stora partier utom kommunisterna. Regeringen förklarade Sverige neutralt. Under beredskapstiden kallades hundratusentals män in till militären.","ex":0},{"id":"dnf","d":"april–juni 1940","y0":1940,"y1":1940,"c":"Västeuropa","t":"Tyskland anfaller Danmark, Norge och Frankrike","x":"I april 1940 anföll Tyskland Danmark och Norge. I maj kom blixtkriget mot Nederländerna, Belgien och Frankrike, som gav upp efter sex veckor. Norra Frankrike ockuperades och södra delen styrdes av Vichyregimen. I Norge samarbetade Quisling med tyskarna.","ex":0},{"id":"slagetsb","d":"1940","y0":1940,"y1":1940,"c":"Storbritannien","t":"Slaget om Storbritannien","x":"Sommaren 1940 försökte det tyska flygvapnet slå ut det brittiska för att kunna invadera Storbritannien. Först anfölls flygplatser och radarstationer. Britterna hade radar och snabba jaktplan och höll stånd. Churchill tackade piloterna: ”Aldrig har så många haft så få att tacka för så mycket.”","ex":0},{"id":"blitzen","d":"hösten 1940","y0":1940,"y1":1940,"c":"Storbritannien","t":"Blitzen: bomber mot London och andra städer","x":"När Tyskland inte vann i luften började de bomba London och andra städer, ofta nattetid. Bombningarna kallas Blitzen. Londonborna sov i skyddsrum och i tunnelbanan.","ex":1},{"id":"trupp","d":"1940–1943","y0":1940,"y1":1943,"c":"Sverige","t":"Tyska trupptransporter genom Sverige","x":"Sverige lät tyska soldater på permission och krigsmateriel resa med tåg genom Sverige mellan Norge och Tyskland (permittenttrafiken). 1941 fick även en hel tysk division resa genom Sverige till Finland. Det var ett stort avsteg från neutraliteten, liksom den omfattande handeln med Tyskland.","ex":0},{"id":"barbarossa","d":"juni 1941","y0":1941,"y1":1941,"c":"Sovjet","t":"Tyskland anfaller Sovjet (Operation Barbarossa)","x":"Den 22 juni 1941 anföll Tyskland Sovjetunionen med omkring tre miljoner soldater. Hitler ville ha ”livsrum” och krossa kommunismen. Tyskarna nådde nästan Moskva men stoppades i december.","ex":0},{"id":"fortsattning","d":"juni 1941","y0":1941,"y1":1941,"c":"Finland","t":"Finska fortsättningskriget","x":"Finland gick med i kriget mot Sovjet för att ta tillbaka det som förlorats i vinterkriget. Finland kallade sig ”medkrigförande” och inte allierad med Tyskland.","ex":0},{"id":"indokina","d":"juli 1941","y0":1941,"y1":1941,"c":"Asien","t":"Japan tar över Indokina","x":"Japan tog Franska Indokina för att få råvaror och baser. USA svarade med att stoppa all export av olja till Japan.","ex":0},{"id":"pearl","d":"7 dec 1941","y0":1941,"y1":1941,"c":"USA","t":"Japan anfaller USA (Pearl Harbor)","x":"Söndagen den 7 december 1941 anföll japanska flygplan den amerikanska flottbasen Pearl Harbor på Hawaii. Över 2 400 amerikaner dödades och flera slagskepp sänktes. USA gick in i kriget och det blev ett världskrig mellan axelmakterna och de allierade.","ex":0},{"id":"slutgiltiga","d":"1942","y0":1942,"y1":1942,"c":"Europa","t":"Den slutgiltiga lösningen: judar förs till förintelseläger","x":"Vid Wannseekonferensen i januari 1942 planerades hur alla Europas judar skulle mördas. Judar transporterades med tåg till förintelseläger som Treblinka, Sobibor och Auschwitz-Birkenau och gasades ihjäl.","ex":1},{"id":"alamein","d":"1942","y0":1942,"y1":1942,"c":"Nordafrika","t":"Slaget vid el-Alamein","x":"Vid el-Alamein i Egypten stoppade britterna under general Montgomery Rommels armé hösten 1942. Efter det drevs axelmakterna ut ur Nordafrika och gav upp i Tunisien i maj 1943.","ex":0},{"id":"stalingrad","d":"1942–1943","y0":1942,"y1":1943,"c":"Sovjet","t":"Slaget vid Stalingrad","x":"Slaget om Stalingrad pågick från augusti 1942 till februari 1943. Det var ett av krigets blodigaste slag, med strider om varje hus och gata. Den inringade tyska armén gav upp i slutet av januari och början av februari 1943. Omkring 90 000 tyskar togs till fånga. Efter Stalingrad var Tyskland på reträtt i öst.","ex":0},{"id":"italien43","d":"1943","y0":1943,"y1":1943,"c":"Italien","t":"De allierade landstiger på Sicilien och besegrar södra Italien","x":"Sommaren 1943 landsteg de allierade på Sicilien och gick sedan upp genom Italien. Striderna var hårda och Rom befriades först i juni 1944.","ex":1},{"id":"mussolini43","d":"juli 1943","y0":1943,"y1":1943,"c":"Italien","t":"Mussolini avsätts","x":"I juli 1943 avsattes Mussolini och greps på kungens order. Tyska fallskärmssoldater befriade honom senare och han fick leda en lydstat i norra Italien. Den nya italienska regeringen slöt vapenstillestånd med de allierade i september 1943 och förklarade sedan krig mot Tyskland. Tyskland ockuperade då norra och mellersta Italien.","ex":0},{"id":"normandie","d":"6 juni 1944","y0":1944,"y1":1944,"c":"Frankrike","t":"Landstigningen i Normandie (D-dagen)","x":"Den 6 juni 1944 landsteg amerikanska, brittiska och kanadensiska trupper på Normandies stränder i norra Frankrike. Det var den största landstigningen i historien och öppnade en ny front i väst.","ex":0},{"id":"fredfinland","d":"sep 1944","y0":1944,"y1":1944,"c":"Finland","t":"Fred mellan Sovjet och Finland","x":"Finland slöt vapenstillestånd med Sovjet och fick lämna land i öster. Finland var tvunget att driva ut de tyska trupperna, vilket ledde till Lapplandskriget.","ex":0},{"id":"lagren","d":"1945","y0":1945,"y1":1945,"c":"Europa","t":"Koncentrationslägren befrias","x":"När de allierade ryckte fram befriades lägren. Röda armén befriade Auschwitz den 27 januari 1945. Soldaterna hittade utmärglade fångar och massgravar.","ex":1},{"id":"berlin","d":"april 1945","y0":1945,"y1":1945,"c":"Tyskland","t":"Sovjet intar Berlin; Hitler begår självmord","x":"Röda armén anföll Berlin och amerikanska och sovjetiska soldater möttes vid floden Elbe. Den 30 april 1945 begick Hitler självmord i sin bunker i Berlin.","ex":1},{"id":"mussolini45","d":"april 1945","y0":1945,"y1":1945,"c":"Italien","t":"Mussolini dödas av italienska partisaner","x":"I slutet av april 1945 greps Mussolini av italienska partisaner när han försökte fly. Han sköts och hans kropp hängdes upp i Milano.","ex":1},{"id":"kapitulation","d":"maj 1945","y0":1945,"y1":1945,"c":"Tyskland","t":"Tyskland ger upp","x":"Tyskland kapitulerade villkorslöst den 7–8 maj 1945. Den 8 maj firas som dagen då kriget i Europa tog slut.","ex":0},{"id":"atom","d":"aug 1945","y0":1945,"y1":1945,"c":"Japan","t":"Atombomber över Hiroshima och Nagasaki; Japan ger upp","x":"Den 6 augusti 1945 släppte USA en atombomb över Hiroshima. Omkring 70 000–80 000 människor dog direkt och många fler senare av skador och strålning. Tre dagar senare föll en bomb över Nagasaki. Den 15 augusti meddelade kejsaren att Japan gav upp, och andra världskriget var slut.","ex":0},{"id":"nurnbergratt","d":"nov 1945","y0":1945,"y1":1946,"c":"Tyskland","t":"Nürnbergrättegångarna","x":"I Nürnberg ställdes nazistiska ledare inför en internationell domstol. De åtalades för bland annat brott mot freden, krigsförbrytelser och brott mot mänskligheten. Domstolen dömde 12 till döden, 7 till fängelse och frikände 3. Rättegångarna visade att även ledare kan ställas till svars för sina brott.","ex":1}];

  <div class="chips"><button class="chip" data-era="-1" aria-pressed="${st.era<0}">Alla</button>${ERA.map((r,i)=>`<button class="chip" data-era="${i}" style="--pc:${PC[i]}" aria-pressed="${st.era===i}"><i class="dot"></i>${r.n}</button>`).join('')}</div>
  <div class="row"><select id="fYear" aria-label="År"><option value="">Alla år</option>${YEARS.map(k=>`<option${st.year===k?' selected':''}>${k}</option>`).join('')}</select><input type="search" id="fQ" placeholder="Sök händelse, land eller person" aria-label="Sök" value="${esc(st.q)}"></div>
  <div class="chips"><button class="chip" id="fBook" aria-pressed="${st.book}">Bara bokens händelser</button><button class="chip" id="fHide" aria-pressed="${st.hide}">Dölj årtal (testa dig själv)</button></div>
  <div class="count" id="cnt"></div><div id="list"></div>${note}`;
  $('fYear').onchange=e=>{st.year=e.target.value;list();save()};
  let qt;$('fQ').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{st.q=e.target.value.trim();list();save()},150)};
  $('fBook').onclick=()=>{st.book=!st.book;render()};$('fHide').onclick=()=>{st.hide=!st.hide;render()};
  list();
}
function list(){
  const sh=E.filter(match);
  $('cnt').textContent=sh.length===E.length?`${E.length} händelser`:`Visar ${sh.length} av ${E.length}`;
  let lp=-1,lk='',h='';
  for(const e of sh){
    if(e.p!==lp){h+=`<div class="era" style="--pc:${PC[e.p]}"><h2>${ERA[e.p].n}</h2><p>${ERA[e.p].s}</p></div>`;lp=e.p;lk=''}
    if(e.k!==lk){const a=ANC[+e.k];h+=`<div class="yr${a?' anc':''}" style="--pc:${PC[e.p]}">${st.hide?'····':e.k}${a&&!st.hide?`<small>ankarår</small>`:''}</div>`;lk=e.k}
    const o=e.id===open;
    h+=`<div class="ev${o?' open':''}" style="--pc:${PC[e.p]}"><button data-ev="${e.id}" aria-expanded="${o}"><span class="d"><span class="v">${esc(e.d)}</span></span><span class="t">${esc(e.t)}<small>${esc(e.c)}${e.ex?' <span class="tag">extra</span>':''}</small></span><span class="m">${known(e.id)?'<span class="okc" title="Du kan den">✓</span>':''}</span></button>${o?`<div class="x"><p>${esc(e.x)}</p>${e.exact?`<p class="lk">${trick(e)}</p>`:''}${e.ch.length?`<p class="lk">Ingår i sambandet ${e.ch.map(c=>`<button data-gochain="${c}">${esc(CH[c].n)}</button>`).join(', ')}.</p>`:''}<button class="btn" data-know="${e.id}">${known(e.id)?'Jag kan den inte än':'✓ Jag kan den'}</button></div>`:''}</div>`;
  }
  $('list').className=st.hide?'hide':'';
  $('list').innerHTML=h||`<p class="empty">Inga händelser matchar.</p>`;
}
/* SAMBAND */
function samband(){
  if(st.chain<0){
    app.innerHTML=`<p class="intro">Historia handlar om orsak och följd. Varje samband är en kedja av händelser och <b>varför</b> den ena ledde till den andra. Det är det frågorna i boken, som ”Hur gynnades nazisterna av…”, frågar efter.</p>
    <div class="cgrid">${CH.map((c,i)=>{const ev=c.st.map(x=>BY[x]);const k=ev.filter(e=>known(e.id)).length;return `<button class="ccard" data-chain="${i}" style="--c1:${PC[ev[0].p]};--c2:${PC[ev[ev.length-1].p]}"><h3>${esc(c.n)}</h3><span>${esc(c.s)}</span><span>${ev[0].y0}–${ev[ev.length-1].y0} · ${c.st.length} steg · du kan ${k}</span></button>`}).join('')}</div>${note}`;
    return;
  }
  const c=CH[st.chain];
  app.innerHTML=`<div class="chain${st.hidewhy?' hidewhy':''}"><div class="cbar" style="margin-bottom:0"><button class="btn" id="back">← Alla samband</button></div>
  <h2>${esc(c.n)}</h2><p class="lead">${esc(c.s)}</p>
  <div class="chips"><button class="chip" id="hw" aria-pressed="${st.hidewhy}">Dölj förklaringarna (testa dig själv)</button></div>
  ${c.st.map((x,j)=>{const e=BY[x];return `<div class="step" style="--pc:${PC[e.p]}"><div class="d">${esc(e.d)} · ${esc(e.c)}</div>${esc(e.t)}</div>${j<c.w.length?`<div class="why"><span>${esc(c.w[j])}</span></div>`:''}`}).join('')}
  <div class="cbar"><button class="btn pri" data-start="chain:${st.chain}">Öva på det här sambandet →</button></div></div>`;
  $('back').onclick=()=>{st.chain=-1;render()};
  $('hw').onclick=()=>{st.hidewhy=!st.hidewhy;render()};
}

  <div class="chips"><button class="chip" id="hd" aria-pressed="${st.hidedef}">Dölj förklaringarna</button><button class="chip" data-start="terms">Öva begreppen som flashcards →</button></div>

/* FRÅGOR */
function fragor(){
  let n=0;
  app.innerHTML=`<p class="intro">Bokens ”Frågor”, som ofta liknar provfrågor. <b>Svara själv först</b>, högt eller på papper, och jämför sedan med stödpunkterna. Bocka av de frågor du kan svara på.</p>
  ${QS.map(([g,list],gi)=>`<h2 style="font-size:24px;margin:22px 0 10px">${g} <span class="tag">${list.filter((_,j)=>QD[gi+'-'+j]).length}/${list.length} klara</span></h2>${list.map(([q,a],j)=>{const k=gi+'-'+j;const o=QD['o'+k];return `<div class="qitem${QD[k]?' done':''}"><h3><span class="nr">${j+1}</span><span>${esc(q)}</span></h3>${o?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div class="acts"><button class="btn" data-qopen="${k}">${o?'Dölj stödpunkter':'Visa stödpunkter'}</button><button class="btn" data-qdone="${k}">${QD[k]?'✓ Klar':'Jag kan svara'}</button></div></div>`}).join('')}`).join('')}${note}`;

/* ÖVA */
const shuffle=a=>{for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a};
function scopeItems(sc){
  const [t,v]=sc.split(':');
  if(t==='terms')return T;
  if(t==='book')return E.filter(e=>!e.ex);
  if(t==='era')return E.filter(e=>e.p===+v);
  if(t==='chain')return CH[+v].st.map(x=>BY[x]);
  if(t==='list')return v.split('|').map(x=>BY[x]||T.find(q=>q.id===x)).filter(Boolean);
  return [...E,...T];
}
function prio(x){let p=Math.random();if(isDue(x.id))p+=6;else if(!seen(x.id))p+=3;else if(!known(x.id))p+=3;p+=(M[x.id]?.w||0);if(known(x.id)&&!isDue(x.id))p-=4;return p}
function build(sc){
  const P=scopeItems(sc);const N=Math.min(10,Math.max(4,P.length));
  const items=[...P].sort((a,b)=>prio(b)-prio(a)).slice(0,N);
  const qs=items.map((x,j)=>x.n?{t:'term',x}:{t:x.exact&&(j%2||box(x.id)>0)?'year':'flash',e:x});
  const evs=P.filter(x=>!x.n);
  if(evs.length){
    const links=LINKS.filter(l=>sc.startsWith('chain:')?l.c===+sc.split(':')[1]:evs.some(e=>e.id===l.a));
    shuffle(links);const nc=Math.min(links.length,sc.startsWith('chain:')?3:2);
    for(let j=0;j<nc;j++)qs.splice(Math.min(2+j*3,qs.length),0,{t:'cause',l:links[j]});
    const ex=evs.filter(e=>e.exact);
    if(sc.startsWith('chain:')){const c=CH[+sc.split(':')[1]].st;const pick=shuffle(c.map((_,j)=>j)).slice(0,4).sort((a,b)=>a-b);qs.push({t:'ord',truth:pick.map(j=>c[j])})}
    else if(new Set(ex.map(e=>e.y0)).size>=4){const by={};for(const e of ex)(by[e.y0]||(by[e.y0]=[])).push(e);const ys=shuffle(Object.keys(by)).slice(0,4).map(Number).sort((a,b)=>a-b);qs.splice(Math.min(6,qs.length),0,{t:'ord',truth:ys.map(y=>shuffle(by[y])[0].id)})}
  }
  return qs.slice(0,12);
}
function mark(k,g,first){const fresh=!M[k];const m=M[k]||(M[k]={b:0,t:0,w:0});if(g===2)m.b=fresh&&first?2:Math.min(m.b+1,4);else if(g===0){m.b=0;m.w=Math.min((m.w||0)+1,3)}m.t=Date.now();save()}
function startS(sc){S={sc,qs:build(sc),i:0,res:[],missed:new Set()};prepQ();render()}
function prepQ(){
  const q=S.qs[S.i];if(!q)return;q.done=false;q.hint=false;q.rev=false;
  if(q.t==='year'){const y=q.e.y0;const c=shuffle([-1,1,-2,2,-3,3,4,-4].map(d=>y+d).filter(v=>v>=1910&&v<=1950)).slice(0,3);q.opts=[y,...c].sort((a,b)=>a-b)}
  if(q.t==='cause'){const b=BY[q.l.b];const pool=E.filter(e=>e.id!==q.l.a&&e.id!==q.l.b&&Math.abs(e.y0-b.y0)<=6&&!LINKS.some(l=>l.a===q.l.a&&l.b===e.id));q.opts=shuffle([b,...shuffle(pool).slice(0,3)])}
  if(q.t==='ord'){q.items=shuffle([...q.truth]);q.sel=[]}
}
const okOrd=(q,x,j)=>x===q.truth[j]||BY[x].y0===BY[q.truth[j]].y0;
function ova(){
  if(!S){
    const all=[...E,...T];const d=all.filter(x=>isDue(x.id)).length,nw=all.filter(x=>!seen(x.id)).length;
    app.innerHTML=`<div class="start"><h2>Öva</h2><p>Korta pass med blandade frågor: flashcards där du först tänker själv, årtal, begrepp, rätt ordning och orsak och följd. Det du missar kommer tillbaka snart, det du kan kommer mer sällan.</p>
    <button class="opt rec" data-start="smart"><span><b>Dagens pass</b><small>${d?`${d} att repetera · `:''}${nw} nya kvar · händelser och begrepp blandat</small></span><span class="go">→</span></button>
    <button class="opt" data-start="book"><span><b>Bokens tidslinje</b><small>${E.filter(e=>!e.ex).length} händelser · ${E.filter(e=>!e.ex&&known(e.id)).length} kan</small></span><span class="go">→</span></button>
    <button class="opt" data-start="terms"><span><b>Begrepp</b><small>${T.length} ord · ${T.filter(t=>known(t.id)).length} kan</small></span><span class="go">→</span></button>
    <div class="sec">En period</div>
    ${ERA.map((r,i)=>{const a=E.filter(e=>e.p===i);return `<button class="opt" data-start="era:${i}" style="border-left:5px solid ${PC[i]}"><span><b>${r.n}</b><small>${a.filter(e=>known(e.id)).length} av ${a.length} kan</small></span><span class="go">→</span></button>`}).join('')}
    <div class="sec">Ett samband</div>
    ${CH.map((c,i)=>`<button class="opt" data-start="chain:${i}"><span><b>${esc(c.n)}</b><small>${c.st.length} steg</small></span><span class="go">→</span></button>`).join('')}</div>`;
    return;
  }
  const q=S.qs[S.i];
  const dots=`<div class="dots">${S.qs.map((_,j)=>`<i class="${j<S.res.length?(S.res[j]?'r':'w'):j===S.i?'c':''}"></i>`).join('')}</div>`;
  if(!q){
    const r=S.res.filter(Boolean).length;const ms=[...S.missed];
    const lbl=k=>{const e=BY[k];if(e)return `<small>${esc(e.d)} · ${esc(e.c)}</small>${esc(e.t)}`;const t=T.find(x=>x.id===k);return `<small>Begrepp</small>${esc(t.n)}`};
    app.innerHTML=`<div class="sum"><div class="qtop">${dots}</div><div class="big">${r}/${S.res.length}</div><p>${!S.res.length?'Passet avbröts.':r===S.res.length?'Alla rätt. Snyggt!':r>=S.res.length*.7?'Bra jobbat. Missarna kommer tillbaka snart.':'Bra att du övar. Missarna kommer tillbaka tills du kan dem.'}</p>
    ${ms.length?`<div class="miss"><div class="sec">Repetera de här</div>${ms.map(k=>`<div>${lbl(k)}</div>`).join('')}</div>`:''}
    <div class="cbar" style="justify-content:center">${ms.length?`<button class="btn pri" data-start="list:${esc(ms.join('|'))}">Öva på missarna</button>`:''}<button class="btn${ms.length?'':' pri'}" data-start="${esc(S.sc)}">Ett pass till</button><button class="btn" id="quit">Klar</button></div></div>`;
    $('quit').onclick=()=>{S=null;render()};return;
  }
  const top=`<div class="qtop"><button class="btn" id="quit" aria-label="Avsluta passet">✕</button>${dots}<span class="kbd" style="margin:0">${S.i+1}/${S.qs.length}</span></div>`;
  const rateB=`<div class="ask">Hur gick det?</div><div class="rate"><button class="btn b0" data-rate="0">Kunde inte<br><small>1</small></button><button class="btn" data-rate="1">Ungefär<br><small>2</small></button><button class="btn b2" data-rate="2">Kunde det<br><small>3</small></button></div>`;
  let body='';
  if(q.t==='flash'){
    const e=q.e;
    body=`<div class="qcard" style="--pc:${PC[e.p]}"><div class="qmeta"><span>Flashcard · ${esc(e.c)}</span></div>
    <div class="q">${esc(e.t)}</div>
    ${q.rev?`<div class="big" style="color:${PC[e.p]}">${esc(e.d)}</div><p>${esc(e.x)}</p>${e.exact?`<p class="tip">${trick(e)}</p>`:''}${rateB}`
    :`<div class="ask">När hände det, och varför var det viktigt? Tänk ut svaret först.</div><button class="btn pri" id="rev" style="width:100%">Visa svaret</button>`}
    <p class="kbd">Mellanslag visar svaret, 1–3 bedömer.</p></div>`;
  }else if(q.t==='term'){
    const t=q.x;
    body=`<div class="qcard" style="--pc:${t.g?'var(--p2)':'var(--p0)'}"><div class="qmeta"><span>Begrepp · ${TERMS[t.g][0]}</span></div>
    <div class="q">${esc(t.n)}</div>
    ${q.rev?`<p style="font-size:18px">${esc(t.d)}</p>${rateB}`:`<div class="ask">Vad betyder det? Förklara med egna ord först.</div><button class="btn pri" id="rev" style="width:100%">Visa förklaringen</button>`}
    <p class="kbd">Mellanslag visar svaret, 1–3 bedömer.</p></div>`;
  }else if(q.t==='year'){
    const e=q.e,ok=q.ans===e.y0;
    body=`<div class="qcard" style="--pc:${PC[e.p]}"><div class="qmeta"><span>Vilket år? · ${esc(e.c)}</span></div>
    <div class="q">${esc(e.t)}</div>
    <div class="opts">${q.opts.map(y=>`<button class="btn${q.done?(y===e.y0?' right':y===q.ans?' wrong':''):''}" data-opt="${y}" ${q.done?'disabled':''}>${y}</button>`).join('')}</div>
    ${!q.done?(q.hint?`<p class="tip">Ledtråd: ${hint(e)}</p>`:`<p class="tip"><button class="btn" id="hintb">Ledtråd</button></p>`):''}
    ${q.done?`<div class="fb"><b class="${ok?'ok':'bad'}">${ok?'Rätt!':'Inte riktigt.'}</b> ${esc(e.d)}.<p>${esc(e.x)}</p><p class="tip">${trick(e)}</p></div>`:''}
    <p class="kbd">1–4 svarar, Enter går vidare.</p></div>`;
  }else if(q.t==='cause'){
    const a=BY[q.l.a],b=BY[q.l.b],ok=q.ans===b.id;
    body=`<div class="qcard" style="--pc:${PC[a.p]}"><div class="qmeta"><span>Orsak och följd · ${esc(CH[q.l.c].n)}</span><span>${esc(a.d)}</span></div>
    <div class="q">${esc(a.t)}</div><div class="ask">Vad hände sedan, som en följd av det här?</div>
    <div class="opts txt">${q.opts.map(o=>`<button class="btn${q.done?(o.id===b.id?' right':o.id===q.ans?' wrong':''):''}" data-cause="${o.id}" ${q.done?'disabled':''}>${esc(o.t)}</button>`).join('')}</div>
    ${q.done?`<div class="fb"><b class="${ok?'ok':'bad'}">${ok?'Rätt!':'Inte riktigt.'}</b> ${esc(b.d)}: ${esc(b.t)}.<p><b>Varför:</b> ${esc(q.l.w)}</p></div>`:''}
    <p class="kbd">1–4 svarar, Enter går vidare.</p></div>`;
  }else{
    const pos=k=>q.sel.indexOf(k);
    body=`<div class="qcard" style="--pc:var(--ink)"><div class="qmeta"><span>Rätt ordning</span></div><div class="q">Tryck i tidsordning, äldst först</div>
    <div class="ord">${q.items.map(k=>{const e=BY[k],s=pos(k);const c=q.done?(okOrd(q,k,s)?' ri':' wr'):'';return `<button class="btn${s>=0?' sel':''}${c}" data-ord="${k}" ${q.done?'disabled':''}><span class="n">${s>=0?s+1:''}</span><span>${esc(e.t)}</span>${q.done?`<span class="y">${esc(e.d)}</span>`:''}</button>`}).join('')}</div>
    ${q.done?`<div class="fb"><b class="${q.ok?'ok':'bad'}">${q.ok?'Rätt ordning!':'Rätt ordning är:'}</b><p>${q.truth.map((k,j)=>`${j+1}. ${esc(BY[k].d)}: ${esc(BY[k].t)}`).join('<br>')}</p></div>`:(q.sel.length?`<p class="tip"><button class="btn" id="undo">Ångra</button></p>`:'')}</div>`;
  }
  const nextb=q.done?`<div class="qbar"><span></span><button class="btn pri" id="nq">Nästa →</button></div>`:'';
  app.innerHTML=top+body+nextb;
  const qc=app.querySelector('.qcard');if(qc&&S.anim!==S.i){qc.classList.add('new');S.anim=S.i}
  $('quit').onclick=()=>{S.qs=S.qs.slice(0,S.res.length);S.i=S.res.length;render()};
  if($('rev'))$('rev').onclick=reveal;
  if($('hintb'))$('hintb').onclick=()=>{q.hint=true;ova()};
  if($('undo'))$('undo').onclick=()=>{q.sel.pop();ova()};
  if($('nq')){$('nq').onclick=nextQ;$('nq').focus({preventScroll:true})}
}
function reveal(){const q=S.qs[S.i];if((q.t==='flash'||q.t==='term')&&!q.rev){q.rev=true;ova()}}
function done(ok,ids){S.res.push(ok);if(!ok)ids.forEach(k=>S.missed.add(k));head()}
function nextQ(){S.i++;prepQ();ova();scrollTo({top:0})}
function rate(g){const q=S.qs[S.i];if(!(q.t==='flash'||q.t==='term')||!q.rev)return;const k=(q.e||q.x).id;mark(k,g,true);done(g>0,[k]);if(g===0)S.missed.add(k);nextQ()}
function answer(v){const q=S.qs[S.i];if(q.done)return;q.done=true;q.ans=v;
  if(q.t==='year'){const ok=v===q.e.y0;mark(q.e.id,ok?2:0);done(ok,[q.e.id])}
  if(q.t==='cause'){const ok=v===q.l.b;mark(q.l.b,ok?2:0);done(ok,[q.l.b])}
  ova()}
function pickOrd(k){const q=S.qs[S.i];if(q.done||q.sel.includes(k))return;q.sel.push(k);
  if(q.sel.length===q.items.length){q.done=true;q.ok=q.sel.every((x,j)=>okOrd(q,x,j));
    q.sel.forEach((x,j)=>mark(x,okOrd(q,x,j)?2:0));done(q.ok,q.ok?[]:q.truth.filter((x,j)=>q.sel[j]!==x))}
  ova()}
/* wiring */
function render(){head();save();({las,samband,begrepp,fragor,ova})[st.view]()}
function go(v){st.view=v;try{history.replaceState(null,'','#'+v)}catch(_){}render();scrollTo({top:0})}
document.querySelector('nav').addEventListener('click',ev=>{const b=ev.target.closest('[data-v]');if(b)go(b.dataset.v)});
app.addEventListener('click',ev=>{
  const t=ev.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.era!==undefined){st.era=+d.era;st.year='';render()}
  else if(d.ev!==undefined){open=open===d.ev?'':d.ev;list();const b=app.querySelector(`[data-ev="${d.ev}"]`);b&&b.focus({preventScroll:true})}
  else if(d.know!==undefined){const k=d.know;M[k]=known(k)?{b:0,t:Date.now(),w:M[k]?.w||0}:{b:2,t:Date.now(),w:0};save();head();list()}
  else if(d.term!==undefined){if(st.hidedef){revT.has(d.term)?revT.delete(d.term):revT.add(d.term);t.classList.toggle('rev')}}
  else if(d.qopen!==undefined){QD['o'+d.qopen]=!QD['o'+d.qopen];save();fragor()}
  else if(d.qdone!==undefined){QD[d.qdone]=!QD[d.qdone];save();fragor()}
  else if(d.gochain!==undefined){st.chain=+d.gochain;go('samband')}
  else if(d.chain!==undefined){st.chain=+d.chain;render();scrollTo({top:0})}
  else if(d.start){if(st.view!=='ova'){st.view='ova';try{history.replaceState(null,'','#ova')}catch(_){}}startS(d.start);scrollTo({top:0})}
  else if(d.opt)answer(+d.opt);
  else if(d.cause)answer(d.cause);
  else if(d.rate)rate(+d.rate);
  else if(d.ord)pickOrd(d.ord);
});
document.addEventListener('keydown',ev=>{
  if(st.view!=='ova'||!S||ev.target.matches('input,select'))return;const q=S.qs[S.i];if(!q)return;
  if(q.t==='flash'||q.t==='term'){if(!q.rev&&(ev.key===' '||ev.key==='Enter')){ev.preventDefault();reveal()}else if(q.rev&&/^[1-3]$/.test(ev.key))rate(+ev.key-1)}
  else if(!q.done&&/^[1-4]$/.test(ev.key)&&q.opts){const o=q.opts[+ev.key-1];if(o!==undefined)answer(q.t==='year'?o:o.id)}
  else if(q.done&&ev.key==='Enter'&&ev.target.id!=='nq'){ev.preventDefault();nextQ()}
});
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS.includes(v)&&v!==st.view){st.view=v;render()}});
render();
}
</script>
